<!-- China search / AI crawler hints 中國大陸搜尋引擎與 AI 爬蟲最佳化 -->
<!-- Baidu: declare page works on both PC and mobile; forbid transcoding -->
<meta name="applicable-device" content="pc,mobile">
<meta http-equiv="Cache-Control" content="no-transform">
<!-- 360 browser: force webkit rendering -->
<meta name="renderer" content="webkit">
<!-- Allow full-length snippets in AI answers / search previews -->
<meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large">
<!-- AI-readable site index (llms.txt) discovery -->
<link rel="alternate" type="text/plain" href="{{ '/llms.txt' | relative_url }}" title="llms.txt">

<!-- Google Scholar bibliographic metadata (index page only; values in _config.yml `citation:`) -->
{% if page.url == "/" %}
<meta name="citation_title" content="{{ site.citation.title }}">
<meta name="citation_author" content="{{ site.citation.author }}">
<meta name="citation_author_institution" content="{{ site.citation.institution }}">
<meta name="citation_publication_date" content="{{ site.citation.date }}">
<meta name="citation_technical_report_institution" content="{{ site.citation.institution }}">
<meta name="citation_technical_report_number" content="v{{ site.citation.version }}">
<meta name="citation_doi" content="{{ site.citation.doi }}">
<meta name="citation_pdf_url" content="{{ site.citation.pdf_url }}">
<meta name="citation_abstract_html_url" content="{{ site.url }}{{ site.baseurl }}/">
<meta name="citation_language" content="en">
{% endif %}
